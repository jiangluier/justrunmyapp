name: JustRunMy-renew
on:
  workflow_dispatch:
  schedule:
    # 北京时间每天 07:00 = UTC 23:00
    # GitHub Actions 的 cron 只认 UTC;高峰期可能延迟数分钟到数十分钟
    - cron: '0 23 * * *'

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - name:  下载代码
        uses: actions/checkout@v6
      - name:  设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ️ 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            xdotool \
            scrot \
            fonts-noto-cjk

      - name:  安装 Python 依赖
        run: |
          pip install seleniumbase aiohttp requests
          seleniumbase install chromedriver

      - name: 🌐 设置sing-box代理转发
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          JUSTRUNMY_EMAIL: ${{ secrets.JUSTRUNMY_EMAIL }}
          JUSTRUNMY_PASSWORD: ${{ secrets.JUSTRUNMY_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python3 app.py

      # ---------------------------------------------------------
      # Keep-alive:更新时间戳文件,防止仓库 60 天无活动导致
      # schedule 被自动禁用。只在有实际变更时才提交。
      # ---------------------------------------------------------
      - name: Keep-alive commit
        run: |
          date -u '+%Y-%m-%d' > keepalive.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.md
          if git diff --staged --quiet; then
            echo "无变更,跳过提交"
          else
            git commit -m "keepalive [skip ci]"
            git push
          fi
